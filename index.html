<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="" id="meta-description">
    <meta name="theme-color" content="#1a1a1a">
    <title>ELIF GAMES</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Site icon and styles are configured at runtime -->
    <link id="site-favicon" rel="icon" type="image/jpeg">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header" id="header">
        <nav class="nav container" aria-label="Main navigation">
            <a class="nav__logo" href="#home" aria-label="ELIF GAMES home">
                <img id="header-logo" alt="" class="nav__logo-img">
                <span class="nav__logo-text" data-key="site.logoName">ELIF GAMES</span>
            </a>

            <div class="nav__menu" id="nav-menu">
                <ul class="nav__list" id="nav-list"></ul>
                <div class="nav__actions">
                    <div class="nav__language">
                        <select class="language-select" id="language-select" aria-label="Select language"></select>
                    </div>
                </div>
            </div>

            <button class="nav__toggle" id="nav-toggle" type="button" aria-label="Toggle menu" aria-controls="nav-menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <main class="main">
        <!-- Slides, indicators and their images are rendered from data/config.json. -->
        <section class="hero" id="home" aria-label="Studio introduction">
            <div class="hero__slider" id="hero-slider"></div>
            <div class="hero__indicators" id="hero-indicators" aria-label="Carousel controls"></div>
        </section>

        <!-- Temporary featured announcement. Replace with dated content entries when the news archive is implemented. -->
        <section class="featured section" id="featured">
            <div class="container">
                <div class="section__header">
                    <span class="section__subtitle" data-key="featuredGame.title"></span>
                    <h2 class="section__title" data-key="featuredGame.subtitle"></h2>
                </div>

                <div class="featured__content">
                    <div class="featured__info">
                        <h3 class="featured__name" data-key="featuredGame.name"></h3>
                        <p class="featured__description" data-key="featuredGame.description"></p>
                        <ul class="featured__features" id="featured-features" hidden></ul>
                        <div class="featured__buttons">
                            <a id="featured-learn-more" class="btn btn--secondary" data-key="featuredGame.buttons.learnMore"></a>
                            <a id="featured-play-now" class="btn btn--primary" data-key="featuredGame.buttons.playNow"></a>
                        </div>
                    </div>

                    <div class="featured__image">
                        <img id="featured-image" alt="" class="featured__img" loading="lazy" decoding="async">
                    </div>
                </div>
            </div>
        </section>

        <section class="about section section--dark" id="about">
            <div class="container">
                <div class="section__header">
                    <span class="section__subtitle" data-key="about.title"></span>
                    <h2 class="section__title" data-key="about.subtitle"></h2>
                </div>

                <div class="about__content">
                    <div class="about__description">
                        <p data-key="about.description"></p>
                    </div>
                    <div class="about__mission">
                        <h3 class="about__mission-title" data-key="about.mission"></h3>
                        <p class="about__mission-text" data-key="about.missionText"></p>
                    </div>
                    <div class="about__values" id="about-values"></div>
                </div>
            </div>
        </section>

        <section class="gallery section" id="games">
            <div class="container">
                <div class="section__header">
                    <span class="section__subtitle" data-key="gallery.title"></span>
                    <h2 class="section__title" data-key="gallery.subtitle"></h2>
                </div>

                <div class="gallery__grid" id="gallery-grid"></div>
                <!-- hide show more
                <div class="gallery__actions" id="gallery-actions" hidden>
                    <button class="btn btn--secondary gallery__load-more" id="load-more-games" type="button" aria-expanded="false">
                        <span class="load-more-text" data-key="gallery.buttons.loadMore"></span>
                        <svg class="load-more-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
                -->
            </div>
        </section>
    </main>

    <footer class="footer section--dark" id="contact">
        <div class="container">
            <div class="footer__content">
                <div class="footer__section">
                    <div class="footer__logo">
                        <img id="footer-logo" alt="" class="footer__logo-img" loading="lazy" decoding="async">
                    </div>
                    <p class="footer__description" data-key="footer.description"></p>
                </div>

                <div class="footer__section">
                    <h3 class="footer__title" data-key="footer.social.title"></h3>
                    <div class="footer__social" id="footer-social"></div>
                </div>
            </div>

            <div class="footer__bottom">
                <p class="footer__copyright" data-key="footer.copyright"></p>
            </div>
        </div>
    </footer>

    <button class="scroll-top" id="scroll-top" type="button" aria-label="Scroll to top">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M7 14L12 9L17 14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <div class="app-error" id="app-error" role="alert" hidden></div>

    <script src="js/main.js"></script>
</body>
</html>
